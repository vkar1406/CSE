<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Copilot · Sign in</title><style>body{font:16px system-ui;background:#eef3fb;color:#152541;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;border:1px solid #d8e2f0;border-radius:16px;padding:30px;max-width:390px;width:90%;box-shadow:0 12px 30px #1232}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin-top:12px;font:inherit}input{border:1px solid #c9d6e6}button{background:#2458bd;color:white;border:0;cursor:pointer}p{color:#63728a}#status{color:#aa2840}</style></head><body><main><h2>Interview Command Center</h2><p>Sign in with your private dashboard password.</p><form id="f"><input type="password" id="password" autocomplete="current-password" placeholder="Dashboard password" required><button>Open dashboard</button></form><p id="status" role="alert"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let s=document.getElementById('status');s.textContent='Signing in…';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok)throw Error('Incorrect password or server not configured');location.replace('/')}catch(err){s.textContent=err.message}}</script></body></html>
